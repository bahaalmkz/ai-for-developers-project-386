name: ci

on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v4, закреплено по SHA
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # jdx/mise-action v2, закреплено по SHA
      - name: Install mise and tools from mise.toml
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      # Системные библиотеки для Chromium из браузерного сценария (сам браузер ставит mise run e2e)
      - name: Install Playwright system dependencies
        working-directory: e2e
        run: npm ci && npx playwright install-deps chromium

      - name: Run checks
        run: mise run check

      # openapi.yaml коммитится: после генерации в mise run check он не должен отличаться от закоммиченного
      - name: Check generated contract is committed
        run: |
          git diff --exit-code -- contract
          test -z "$(git status --porcelain -- contract)"
