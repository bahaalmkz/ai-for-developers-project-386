openapi: 3.0.0
info:
  title: Календарь звонков API
  version: 0.0.0
tags:
  - name: Health
  - name: EventTypes
  - name: Slots
paths:
  /api/event-types:
    get:
      operationId: listEventTypes
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - EventTypes
  /api/event-types/{id}/slots:
    get:
      operationId: listSlots
      description: Свободные слоты типа встречи на окно записи (14 дней), по возрастанию старта.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Slots
  /api/health:
    get:
      operationId: getHealth
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
      tags:
        - Health
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
      description: Единый формат ошибки.
    EventType:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
          description: 'Идентификатор: латиница в нижнем регистре, цифры, дефис.'
        title:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
          description: Длительность в минутах, кратна 30, от 30 до 480.
      description: 'Тип встречи: предложение владельца.'
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Slot:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
      description: 'Свободный слот: интервал времени в поясе владельца (+05:00).'
servers:
  - url: http://localhost:8080
    description: Локальный сервер разработки
    variables: {}
