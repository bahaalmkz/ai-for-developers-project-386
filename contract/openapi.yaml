openapi: 3.0.0
info:
  title: Календарь звонков API
  version: 0.0.0
tags:
  - name: Health
paths:
  /api/health:
    get:
      operationId: getHealth
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
      tags:
        - Health
components:
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
servers:
  - url: http://localhost:8080
    description: Локальный сервер разработки
    variables: {}
